# Fast, deterministic local gates. Heavy checks run on pre-push / in CI.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # --- Repository hygiene --------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored theme is not ours to lint/format — skip it everywhere.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=*]
        exclude: "^themes/"
      - id: end-of-file-fixer
        exclude: "^themes/"
      - id: check-yaml
        exclude: "^themes/"
      - id: check-json
        exclude: "^themes/"
      - id: check-toml
        exclude: "^themes/"
      - id: check-merge-conflict
        exclude: "^themes/"
      - id: check-case-conflict
        exclude: "^themes/"
      - id: check-added-large-files
        args: [--maxkb=512]
        exclude: "^themes/"
      - id: detect-private-key
        exclude: "^themes/"
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: "^themes/"
      - id: debug-statements # blocks breakpoint()/pdb.set_trace() commits

  # --- Formatting (prettier provided by mise) ------------------------------
  - repo: local
    hooks:
      - id: prettier
        name: prettier (mise)
        entry: mise x -- prettier --write
        language: system
        types_or: [javascript, json, markdown, yaml]
        exclude: "^(layouts|themes|public|resources)/"

  # --- Secret scanning -----------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- Heavier gate right before pushing -----------------------------------
  - repo: local
    hooks:
      - id: make-check
        name: make check (format · build)
        entry: make check
        language: system
        pass_filenames: false
        stages: [pre-push]
